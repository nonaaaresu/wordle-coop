<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wordle en equipo</title>
<style>
:root{--bg:#121316;--panel:#1b1d22;--line:#34373f;--tx:#f2f2f2;--mut:#8b909b;--g:#2f7d4a;--y:#a88a2a;--x:#2a2c32;--key:#7c8186;--hl:#e8e4d8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Helvetica Neue",Arial,sans-serif;min-height:100vh}
button,input{font:inherit;color:inherit}button{cursor:pointer}
.wrap{max-width:1000px;margin:0 auto;padding:12px}
h1{font-size:22px;margin:8px 0}
.panel{background:var(--panel);border-radius:10px;padding:16px;margin:12px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn,input{background:var(--x);border:1px solid var(--line);border-radius:8px;padding:10px 16px}
.btn.on{background:var(--hl);color:#111;border-color:var(--hl)}
.btn.go{background:var(--g);border-color:var(--g);font-weight:700}
.mut{color:var(--mut);font-size:14px}
.code{font-size:44px;font-weight:700;letter-spacing:8px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.clock{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}.clock.low{color:#e5624d}
.chip{border:2px solid var(--c);border-radius:20px;padding:4px 12px;font-size:14px}
.chip.me{background:var(--c);color:#111;font-weight:700}
.sent{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;padding:12px;font-size:20px}
.tok{color:var(--mut)}
.slot{display:inline-flex;gap:2px;padding:3px;border-radius:6px;border:2px solid transparent;background:none}
.slot.sel{border-color:var(--hl)}.slot.bad{border-color:#e5624d}
.slot i{width:20px;height:26px;border-bottom:2px solid var(--line);font-style:normal;font-weight:700;font-size:16px;text-align:center;line-height:24px}
.slot i.k{border-color:var(--g);color:#8fd1a2}
.slot.ok i{background:var(--g);border-color:var(--g);color:#fff}
.game{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px}
@media(max-width:760px){.game{grid-template-columns:1fr}}
.center{display:flex;flex-direction:column;align-items:center;gap:14px}
.board{display:grid;gap:6px}
.brow{display:flex;gap:6px;align-items:center}
.cell{width:54px;height:54px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700}
.cell.g{background:var(--g);border-color:var(--g)}.cell.y{background:var(--y);border-color:var(--y)}
.cell.x{background:var(--x);border-color:var(--x);color:var(--mut)}.cell.t{border-color:#6a6e78}
.who{width:18px;height:18px;border-radius:50%;background:var(--c);color:#111;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.shake{animation:sh .3s}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.nav{display:flex;align-items:center;gap:14px}
.nav .btn{border-radius:50%;width:40px;height:40px;padding:0;background:var(--hl);color:#111}
.kb{display:flex;flex-direction:column;gap:6px;align-items:center;width:100%}
.kr{display:flex;gap:5px}
.k{height:48px;min-width:30px;padding:0 4px;flex:1;max-width:42px;border:0;border-radius:5px;background:var(--key);font-weight:700;color:#fff}
.k.w{max-width:64px;font-size:12px}
.k.g{background:var(--g)}.k.y{background:var(--y)}.k.x{background:var(--x);color:var(--mut)}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:10px;align-content:start}
.th{background:var(--bg);border:2px solid var(--line);border-radius:8px;padding:6px;text-align:center}
.th.sel{border-color:var(--hl)}.th.ok{border-color:var(--g)}.th.bad{border-color:#e5624d}
.mini{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;margin-bottom:4px}
.mini b{aspect-ratio:1;background:#0d0e10;border:1px solid #2a2c32}
.mini b.g{background:var(--g);border-color:var(--g)}.mini b.y{background:var(--y);border-color:var(--y)}.mini b.x{background:#3a3d45}
.th span{font-size:11px;color:var(--mut)}
.dots{height:10px;display:flex;gap:3px;justify-content:center;margin-top:3px}
.dots u{width:8px;height:8px;border-radius:50%;background:var(--c)}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--hl);color:#111;padding:8px 16px;border-radius:8px;font-weight:700;display:none;z-index:5}
.over{position:fixed;inset:0;background:#000c;display:flex;align-items:center;justify-content:center;padding:16px;z-index:4}
.over .panel{max-width:520px;text-align:center}
.slot i.r{color:#e5624d;border-color:#e5624d}
.stats{max-height:94vh;overflow:auto;width:100%;max-width:560px}
.sum{display:flex;justify-content:center;gap:28px;margin:12px 0}
.sum div{display:flex;flex-direction:column}.sum b{font-size:26px}.sum span{font-size:12px;color:var(--mut)}
.awards{display:grid;grid-template-columns:1fr 1fr;gap:8px;text-align:left}
@media(max-width:480px){.awards{grid-template-columns:1fr}}
.aw{display:flex;gap:10px;align-items:center;background:var(--bg);border-radius:8px;padding:10px}
.aw i{font-style:normal;font-size:26px}
.aw div{display:flex;flex-direction:column;min-width:0}.aw small{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.5px}
.aw span{font-size:12px;color:var(--mut)}
.st{width:100%;border-collapse:collapse;margin-top:14px;font-size:14px}
.st th{color:var(--mut);font-weight:400;font-size:12px;padding:4px}.st td{padding:6px 4px;border-top:1px solid var(--line)}
.st td:first-child{text-align:left}.st td+td,.st th+th{text-align:center}
#chat{position:fixed;right:12px;bottom:12px;z-index:6;display:none;flex-direction:column;align-items:flex-end;gap:8px}
#chatBtn{background:var(--hl);color:#111;border:0;border-radius:20px;padding:10px 18px;font-weight:700}
#chatBtn b{background:#e5624d;color:#fff;border-radius:10px;padding:1px 7px;margin-left:6px;font-size:12px}
#chatBox{width:300px;max-width:calc(100vw - 24px);height:320px;background:var(--panel);border:1px solid var(--line);border-radius:10px;display:none;flex-direction:column;overflow:hidden}
#msgs{flex:1;overflow-y:auto;padding:10px;font-size:14px;display:flex;flex-direction:column;gap:6px;word-break:break-word}
#msg{border-radius:0;border:0;border-top:1px solid var(--line);width:100%}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>
<div id="chat"><div id="chatBox"><div id="msgs"></div><input id="msg" maxlength="200" placeholder="Escribí y apretá Enter"></div>
<button id="chatBtn" onclick="toggleChat()">Chat<b id="unread" hidden></b></button></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>

const COLORS=['#e5624d','#4da6e5','#e5c14d','#8fd14d','#c07de5','#e58fb5','#4de5c1','#e59a4d'];
const ROWS=['QWERTYUIOP','ASDFGHJKL','ZXCVBNM'];
const DIFF={facil:'Fácil (2 por jugador)',media:'Media (3 por jugador)',dificil:'Difícil (5 por jugador)'};
const $=s=>document.querySelector(s);
const fmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
let sb,S={cur:0,draft:{},diff:'facil',pres:{},players:[],guesses:[]};

function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',1800)}
async function rpc(fn,args){const r=await sb.rpc(fn,args);if(r.error){toast(r.error.message);return null}return r}

/* ---------- conexion ---------- */
async function boot(){
  if(typeof SUPABASE_URL=='undefined'||typeof SUPABASE_KEY=='undefined'||SUPABASE_URL.includes('TU-')){$('#app').innerHTML='<div class="panel">Falta configurar config.js (debe estar en la misma carpeta que este archivo, con SUPABASE_URL y SUPABASE_KEY).</div>';return}
  let url=SUPABASE_URL.trim();try{url=new URL(url).origin}catch(e){}
  sb=supabase.createClient(url,SUPABASE_KEY.trim());
  let {data:{session}}=await sb.auth.getSession();
  if(!session){const r=await sb.auth.signInAnonymously();
    if(r.error){$('#app').innerHTML='<div class="panel">Error de login anónimo: '+r.error.message+'<br>Activalo en Authentication › Sign In / Providers › Anonymous.</div>';return}
    session=r.data.session}
  S.uid=session.user.id;
  const c=localStorage.getItem('room');if(c)await enter(c);
  render();setInterval(tick,1000);
}
async function load(){
  const q=t=>sb.from(t).select().eq(t=='rooms'?'code':'room',S.code);
  const [r,p,g,m]=await Promise.all([q('rooms').maybeSingle(),q('players').order('color'),q('guesses').order('id'),sb.from('messages').select().eq('room',S.code).order('id').limit(200)]);
  if(!r.data)return false;
  S.room=r.data;S.players=p.data||[];S.guesses=g.data||[];S.msgs=m.data||[];
  if(['won','lost'].includes(S.room.status)&&!S.ans){const a=await sb.rpc('get_answers',{p_code:S.code});S.ans=a.data}
  return true;
}
let rt;const reload=()=>{clearTimeout(rt);rt=setTimeout(async()=>{await load();render()},60)};
async function enter(code){
  S.code=code;S.ans=null;S.cur=0;S.draft={};S.seen=0;S.chatOpen=false;S.hideEnd=false;
  if(!await load()){localStorage.removeItem('room');S.code=null;return}
  localStorage.setItem('room',code);
  const f={schema:'public',filter:'room=eq.'+code};
  S.ch=sb.channel('room-'+code,{config:{presence:{key:S.uid}}})
    .on('postgres_changes',{event:'*',schema:'public',table:'rooms',filter:'code=eq.'+code},reload)
    .on('postgres_changes',{event:'*',...f,table:'players'},reload)
    .on('postgres_changes',{event:'INSERT',...f,table:'guesses'},reload)
    .on('postgres_changes',{event:'INSERT',...f,table:'messages'},reload)
    .on('presence',{event:'sync'},()=>{S.pres=S.ch.presenceState();render()})
    .subscribe(s=>{if(s=='SUBSCRIBED')track()});
}
function track(){const me=S.players.find(p=>p.uid==S.uid);S.ch&&S.ch.track({cur:S.cur,c:me?me.color:0})}
async function leave(){if(S.ch)await sb.removeChannel(S.ch);localStorage.removeItem('room');S.code=null;S.room=null;S.hideEnd=false;render()}
function leaveGame(){if(playing()&&!confirm('¿Salir de la partida? Podés volver a entrar con el código de sala ('+S.code+').'))return;leave()}

/* ---------- acciones ---------- */
const name=()=>{const n=($('#nm')||{}).value||localStorage.getItem('nm')||'';if(n.trim())localStorage.setItem('nm',n.trim());return n.trim()}
async function createRoom(){const n=name();if(!n)return toast('Poné tu nombre');const r=await rpc('create_room',{p_name:n});if(r){await enter(r.data);render()}}
async function joinRoom(){const n=name();if(!n)return toast('Poné tu nombre');const c=$('#cd').value.trim().toUpperCase();
  if(!c)return toast('Poné el código');if(await rpc('join_room',{p_code:c,p_name:n})){await enter(c);render()}}
async function startGame(){if(await rpc('start_game',{p_code:S.code,p_diff:S.diff,p_secs:(S.mins||10)*60})){await load();render()}}

const nBoards=()=>S.room.tokens.filter(t=>t.b!==undefined).length;
const gs=i=>S.guesses.filter(g=>g.idx==i);
const st=i=>{const a=gs(i);return a.some(g=>g.pattern=='ggggg')?'ok':a.length>=6?'bad':'play'};
const left=()=>Math.max(0,Math.round((new Date(S.room.ends_at)-Date.now())/1000));
const playing=()=>S.room&&S.room.status=='playing';

async function tick(){
  if(!playing())return;
  const c=$('#clock'),l=left();if(c){c.textContent=fmt(l);c.classList.toggle('low',l<=20)}
  if(l<=0&&!S.chk){S.chk=1;await rpc('check_time',{p_code:S.code});await load();S.chk=0;render()}
}
function type(ch){if(!playing()||st(S.cur)!='play')return;const d=S.draft[S.cur]||'';if(d.length<5){S.draft[S.cur]=d+ch;render()}}
function back(){if(!playing())return;S.draft[S.cur]=(S.draft[S.cur]||'').slice(0,-1);render()}
async function enter_(){
  if(!playing()||st(S.cur)!='play')return;
  const d=S.draft[S.cur]||'';
  if(d.length<5){toast('Faltan letras');const r=$('.brow.cur');r&&r.classList.add('shake');return}
  S.draft[S.cur]='';
  const r=await rpc('submit_guess',{p_code:S.code,p_idx:S.cur,p_word:d});
  if(!r)S.draft[S.cur]=d;
  await load();render();
}
function go(i){const n=nBoards();S.cur=(i+n)%n;track();render()}

document.addEventListener('keydown',e=>{
  if(!S.room||e.ctrlKey||e.metaKey||e.altKey||e.target.tagName=='INPUT')return;
  if(e.key=='Enter')enter_();else if(e.key=='Backspace')back();
  else if(/^[a-zA-Z]$/.test(e.key))type(e.key.toUpperCase());
  else if(e.key=='ArrowLeft')go(S.cur-1);else if(e.key=='ArrowRight')go(S.cur+1);
});

/* ---------- vistas ---------- */
function render(){
  const a=$('#app');if(!sb)return;
  a.innerHTML=!S.room?home():S.room.status=='lobby'?lobby():game();
  renderChat();
}
function home(){return `<h1>Wordle en equipo</h1><div class="panel">
  <p><b>Tu nombre</b></p><input id="nm" maxlength="20" value="${localStorage.getItem('nm')||''}" placeholder="Nombre">
  <p><button class="btn go" onclick="createRoom()">Crear sala</button></p>
  <p><b>O unite con un código</b></p>
  <div class="row"><input id="cd" maxlength="5" placeholder="ABCDE" style="text-transform:uppercase;width:120px"><button class="btn" onclick="joinRoom()">Unirme</button></div></div>`}

function lobby(){
  const host=S.room.host==S.uid;
  return `<h1>Sala</h1><div class="panel" style="text-align:center">
   <div class="mut">Pasale este código a tus amigos</div><div class="code">${S.code}</div></div>
   <div class="panel"><b>Jugadores (${S.players.length})</b><div class="row" style="margin-top:10px">
   ${S.players.map(p=>`<span class="chip ${p.uid==S.uid?'me':''}" style="--c:${COLORS[p.color]}">${esc(p.name)}${p.uid==S.room.host?' ★':''}</span>`).join('')}</div></div>
   <div class="panel">${host?`<b>Dificultad</b><div class="row" style="margin:10px 0">
   ${Object.entries(DIFF).map(([k,v])=>`<button class="btn ${S.diff==k?'on':''}" onclick="S.diff='${k}';render()">${v}</button>`).join('')}</div>
   <b>Tiempo límite</b><div class="row" style="margin:10px 0">
   ${[3,5,8,10,15,20].map(m=>`<button class="btn ${(S.mins||10)==m?'on':''}" onclick="S.mins=${m};render()">${m} min</button>`).join('')}</div>
   <button class="btn go" onclick="startGame()">Empezar partida</button>`:'<span class="mut">Esperando a que el anfitrión empiece…</span>'}
   <p><button class="btn" onclick="leave()">Salir</button></p></div>`;
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function game(){
  const n=nBoards(),sts=[...Array(n).keys()].map(st),solved=sts.filter(x=>x=='ok').length;
  const ans=i=>S.ans?S.ans[i]:null,fin=S.room.status!='playing';
  const sent=S.room.tokens.map(t=>{
    if(t.t!==undefined)return `<span class="tok">${t.t}</span>`;
    const i=t.b,known=Array(5).fill('');
    gs(i).forEach(g=>{for(let j=0;j<5;j++)if(g.pattern[j]=='g')known[j]=g.word[j]});
    const cells=[0,1,2,3,4].map(j=>sts[i]=='ok'?`<i>${known[j]}</i>`:fin&&S.ans?`<i class="r">${S.ans[i][j]}</i>`:`<i class="${known[j]?'k':''}">${known[j]}</i>`).join('');
    return `<button class="slot ${sts[i]=='ok'?'ok':''} ${sts[i]=='bad'?'bad':''} ${i==S.cur?'sel':''}" onclick="go(${i})">${cells}</button>`}).join('');
  const my=gs(S.cur),stc=sts[S.cur];let rows='';
  for(let r=0;r<6;r++){
    const g=my[r];let cells,cls='brow';
    if(g){const who=S.players.find(p=>p.uid==g.uid);
      cells=[...g.word].map((l,i)=>`<div class="cell ${g.pattern[i]}">${l}</div>`).join('')+`<span class="who" style="--c:${COLORS[who?who.color:0]}" title="${who?esc(who.name):''}">${who?esc(who.name.slice(0,1).toUpperCase()):''}</span>`}
    else{const d=(r==my.length&&stc=='play')?(S.draft[S.cur]||''):'';if(r==my.length&&stc=='play')cls+=' cur';
      cells=[0,1,2,3,4].map(i=>`<div class="cell ${d[i]?'t':''}">${d[i]||''}</div>`).join('')+'<span class="who" style="visibility:hidden"></span>'}
    rows+=`<div class="${cls}">${cells}</div>`}
  const ks={},o={x:0,y:1,g:2};
  my.forEach(g=>[...g.word].forEach((l,i)=>{const s=g.pattern[i];if(ks[l]===undefined||o[s]>o[ks[l]])ks[l]=s}));
  const kb=ROWS.map((r,ri)=>`<div class="kr">${ri==2?'<button class="k w" onclick="enter_()">ENTER</button>':''}${[...r].map(l=>`<button class="k ${ks[l]||''}" onclick="type('${l}')">${l}</button>`).join('')}${ri==2?'<button class="k w" onclick="back()">⌫</button>':''}</div>`).join('');
  const viewers=Object.values(S.pres).map(a=>a[0]).filter(Boolean);
  const th=sts.map((s,i)=>{
    const cells=Array.from({length:30},(_,j)=>{const g=gs(i)[Math.floor(j/5)];return `<b class="${g?g.pattern[j%5]:''}"></b>`}).join('');
    const dots=viewers.filter(v=>v.cur==i).map(v=>`<u style="--c:${COLORS[v.c]}"></u>`).join('');
    return `<button class="th ${i==S.cur?'sel':''} ${s}" onclick="go(${i})"><div class="mini">${cells}</div><span>${i+1} · ${s=='ok'?'resuelta':s=='bad'?'sin intentos':gs(i).length+'/6'}</span><div class="dots">${dots}</div></button>`}).join('');
  const chips=S.players.map(p=>`<span class="chip ${p.uid==S.uid?'me':''}" style="--c:${COLORS[p.color]}">${esc(p.name)}</span>`).join('');
  const over=fin&&!S.hideEnd?`<div class="over"><div class="panel stats">${statsHTML(solved,n)}
    <div class="row" style="justify-content:center;margin-top:14px"><button class="btn go" onclick="S.hideEnd=true;render()">Revisar tableros</button><button class="btn" onclick="leave()">Salir</button></div>
    <p class="mut">Sacá una captura para compartir 📸</p></div></div>`:'';
  const bar=fin&&S.hideEnd?`<div class="panel row">Partida terminada · modo revisión <button class="btn" onclick="S.hideEnd=false;render()">Ver resultados</button></div>`:'';
  return `<div class="top"><div class="row">${chips}</div><div class="mut">Sala ${S.code} · ${solved}/${n}</div><button class="btn" style="padding:6px 12px" onclick="leaveGame()">Salir</button>
    <div class="clock ${left()<=20?'low':''}" id="clock">${fmt(fin?0:left())}</div></div>
    ${bar}<div class="panel sent">${sent}.</div>
    <div class="game"><div class="center">
      <div class="nav"><button class="btn" onclick="go(${S.cur-1})">◀</button><b>Palabra ${S.cur+1} de ${n}</b><button class="btn" onclick="go(${S.cur+1})">▶</button></div>
      <div class="board">${rows}</div>${fin&&stc!='ok'&&S.ans?`<div class="mut">La palabra era <b>${S.ans[S.cur]}</b></div>`:''}<div class="kb">${kb}</div></div>
      <div class="thumbs">${th}</div></div>${over}`;
}
/* ---------- estadisticas ---------- */
function statsHTML(solved,n){
  const P={};S.players.forEach(p=>P[p.uid]={p,solved:0,tries:0,greens:0,msgs:0});
  const B=[];
  for(let i=0;i<n;i++){
    const a=gs(i),known=[0,0,0,0,0],who=new Set();let solver=null;
    a.forEach(g=>{who.add(g.uid);const x=P[g.uid];if(!x)return;x.tries++;
      for(let j=0;j<5;j++)if(g.pattern[j]=='g'&&!known[j]){known[j]=1;x.greens++}
      if(g.pattern=='ggggg'){x.solved++;solver=g.uid}});
    B.push({t:a.length,ok:!!solver,solver,who:who.size,w:S.ans?S.ans[i]:'?'});
  }
  (S.msgs||[]).forEach(m=>{if(P[m.uid])P[m.uid].msgs++});
  const L=Object.values(P).sort((a,b)=>b.solved-a.solved||b.greens-a.greens);
  const top=k=>{const m=Math.max(...L.map(x=>x[k]));return m>0?L.filter(x=>x[k]==m):[]};
  const nm=x=>x.map(y=>esc(y.p.name)).join(' y ');
  const aw=[];
  const mvp=top('solved');if(mvp.length)aw.push(['🏆','MVP',nm(mvp),mvp[0].solved+(mvp[0].solved==1?' palabra resuelta':' palabras resueltas')]);
  const fast=B.filter(b=>b.ok).sort((a,b)=>a.t-b.t)[0];
  if(fast){const x=P[fast.solver];aw.push(['🎯','Francotirador',x?esc(x.p.name):'?',fast.w+' en '+fast.t+(fast.t==1?' intento':' intentos')])}
  const det=top('greens');if(det.length)aw.push(['🔍','Detective',nm(det),det[0].greens+' letras verdes nuevas']);
  if(L.length>1){const g=top('tries');if(g.length)aw.push(['🧨','Gastaintentos',nm(g),g[0].tries+' intentos usados'])}
  const hard=B.filter(b=>b.t>0).sort((a,b)=>b.t-a.t)[0];
  if(hard)aw.push(['😬','Palabra más dura',hard.w,hard.t+' intentos'+(hard.ok?'':' y nadie la sacó')]);
  const ch=top('msgs');if(ch.length)aw.push(['💬','Charlatán',nm(ch),ch[0].msgs+' mensajes']);
  const pl=B.filter(b=>b.t>0);
  if(L.length>1&&pl.length)aw.push(['🤝','Trabajo en equipo',Math.round(100*pl.filter(b=>b.who>1).length/pl.length)+'%','de las palabras las tocó más de uno']);
  const gt=S.guesses.map(g=>+new Date(g.created_at)),dur=gt.length?Math.round((Math.max(...gt)-Math.min(...gt))/1000):0;
  const sent=S.room.tokens.map(t=>t.t!==undefined?t.t:(S.ans?S.ans[t.b]:'?').toLowerCase()).join(' ');
  return `<h1>${S.room.status=='won'?'🎉 ¡Ganaron!':'😵 Perdieron'}</h1>
    <p style="font-size:18px;margin:6px 0">“${sent}”</p>
    <div class="sum"><div><b>${solved}/${n}</b><span>palabras</span></div><div><b>${S.guesses.length}</b><span>intentos</span></div><div><b>${fmt(dur)}</b><span>de juego</span></div></div>
    <div class="awards">${aw.map(a=>`<div class="aw"><i>${a[0]}</i><div><small>${a[1]}</small><b>${a[2]}</b><span>${a[3]}</span></div></div>`).join('')}</div>
    <table class="st"><tr><th></th><th>Resueltas</th><th>Intentos</th><th>Verdes</th><th>Msgs</th></tr>
    ${L.map(x=>`<tr><td><span class="chip" style="--c:${COLORS[x.p.color]}">${esc(x.p.name)}</span></td><td>${x.solved}</td><td>${x.tries}</td><td>${x.greens}</td><td>${x.msgs}</td></tr>`).join('')}</table>`;
}
/* ---------- chat ---------- */
function renderChat(){
  const c=$('#chat');c.style.display=S.room?'flex':'none';if(!S.room)return;
  const ms=S.msgs||[];
  $('#msgs').innerHTML=ms.map(m=>{const p=S.players.find(x=>x.uid==m.uid);
    return `<div><b style="color:${COLORS[p?p.color:0]}">${p?esc(p.name):'?'}</b> ${esc(m.body)}</div>`}).join('')||'<span class="mut">Todavía no hay mensajes.</span>';
  if(S.chatOpen){S.seen=ms.length;const e=$('#msgs');e.scrollTop=e.scrollHeight}
  const u=ms.length-(S.seen||0),b=$('#unread');b.hidden=u<=0;b.textContent=u;
  $('#chatBox').style.display=S.chatOpen?'flex':'none';
}
function toggleChat(){S.chatOpen=!S.chatOpen;renderChat();if(S.chatOpen)$('#msg').focus()}
$('#msg').addEventListener('keydown',async e=>{
  if(e.key!='Enter')return;const i=e.target,v=i.value.trim();if(!v)return;i.value='';
  if(!await rpc('send_message',{p_code:S.code,p_body:v}))i.value=v;
});
boot();
</script>
